name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @is-this-tasty/ui test
      - run: pnpm --filter @is-this-tasty/ui check:contrast
      - run: pnpm --filter @is-this-tasty/ui check:tokens
      - run: pnpm tokens
      - run: git diff --exit-code -- packages/ui/src/theme/tokens.css
