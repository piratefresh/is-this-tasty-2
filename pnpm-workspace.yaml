packages:
  - 'apps/*'
  - 'packages/*'

# Windows: the isolated .pnpm store paths push native build files past 260 chars,
# which the NDK's ninja 1.10 can't stat ("build.ninja still dirty after 100 tries").
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31'
  - '@expo/router-server@57.0.13'
  - '@expo/ui@57.0.25'
  - babel-preset-expo@57.0.16
  - expo-router@57.0.28
  - expo@57.0.30
